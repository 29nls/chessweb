services:
  - type: web
    name: chessweb-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://chessweb-nu.vercel.app
      - key: PORT
        value: "3001"
