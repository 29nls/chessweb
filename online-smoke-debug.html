  grid-area: movehistory;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-height: 400px;
}

/* ── Search / Filter Bar ── */
.move-search-wrapper {
  position: relative;
  margin-bottom: 10px;
}

.move-search-input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 0.82em;
  font-family: inherit;
  box-sizing: border-box;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.move-search-input::placeholder {
  color: var(--text-secondary);
  opacity: 0.6;
}

.move-search-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 2px rgba(93, 173, 226, 0.15);
}

.move-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  opacity: 0.5;
  pointer-events: none;
}

.move-search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.6;
  transition: opacity 0.15s;
}

.move-search-clear:hover {
  opacity: 1;
  background: var(--bg-tertiary);
}

.move-search-count {
  font-size: 0.72em;
  color: var(--text-secondary);
  margin-top: 4px;
  text-align: right;
  opacity: 0.7;
}

.move-history-title {
  font-size: 1em;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 12px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.move-history-title svg {
  color: var(--accent-primary);
}

.move-history-scroll {
  overflow-y: auto;
  flex: 1 1;
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) transparent;
}

.move-history-scroll::-webkit-scrollbar {
  width: 6px;
}

.move-history-scroll::-webkit-scrollbar-track {
  background: transparent;
}

.move-history-scroll::-webkit-scrollbar-thumb {
  background-color: var(--border-color);
  border-radius: 3px;
}

.move-row-header {
  font-weight: 600;
  font-size: 0.75em;
  color: var(--text-secondary);
}

.move-row {
  display: grid;
  grid-template-columns: 36px 1fr 1fr;
  gap: 4px;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.85em;
  animation: fade-in-up 0.3s ease-out forwards;
  transition: background-color 0.15s ease;
  border-radius: 4px;
}

.move-row:hover {
  background-color: var(--bg-tertiary);
}

/* ── Tree main row — has a left accent bar for the tree trunk ── */
.tree-main-row {
  position: relative;
  padding-left: 4px;
}

.tree-main-row::before {
  content: '';
  position: absolute;
  left: -2px;
  top: 10%;
  bottom: 10%;
  width: 2px;
  background-color: var(--border-color);
  opacity: 0.4;
  transition: opacity 0.2s;
}

.tree-main-row.move-row-active::before {
  background-color: var(--accent-primary);
  opacity: 1;
}

.move-row-active {
  background-color: rgba(93, 173, 226, 0.08) !important;
  border-left: 3px solid var(--accent-primary);
  padding-left: 0;
}

.move-row-active .move-cell-clickable .move-san {
  color: var(--accent-primary);
  font-weight: 700;
}

.move-row:last-child {
  border-bottom: none;
}

/* ── Alternatives row — shows book branches as chips ── */
.move-alternatives {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 2px 0 6px 36px; /* Indent under the move number column */
  border-bottom: 1px solid var(--border-color);
  animation: fade-in-up 0.25s ease-out forwards;
}

/* Tree connector line from main row to alternatives */
.alt-connector {
  flex-shrink: 0;
  width: 2px;
  height: 100%;
  min-height: 20px;
  background-color: var(--border-color);
  opacity: 0.3;
  border-radius: 1px;
  margin-right: 4px;
}

.alt-items {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}

.alt-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background-color: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 0.75em;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: default;
  transition: all 0.15s ease;
  font-family: 'Segoe UI', monospace;
}

.alt-chip:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  background-color: var(--bg-secondary);
  transform: translateY(-1px);
}

.alt-move {
  letter-spacing: 0.5px;
}

/* ── Opening label on the main line ── */
.tree-opening-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  background: linear-gradient(135deg, rgba(93, 173, 226, 0.08), rgba(67, 160, 71, 0.08));
  border: 1px solid var(--border-color);
  border-radius: 4px;
  font-size: 0.65em;
  font-weight: 600;
  color: var(--accent-primary);
  white-space: nowrap;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.5;
  margin-left: 4px;
  flex-shrink: 0;
}

.tree-opening-label:hover {
  border-color: var(--accent-primary);
  max-width: 300px;
}

.tree-opening-eco {
  font-size: 0.85em;
  color: var(--text-secondary);
  font-weight: 500;
  padding-left: 3px;
  border-left: 1px solid var(--border-color);
}

.move-number {
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.85em;
  text-align: center;
}

.move-cell-wrapper {
  padding: 2px 6px;
}

.move-cell {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border-radius: 4px;
  transition: all 0.15s ease;
  cursor: default;
  overflow: hidden;
  width: 100%;
}

button.move-cell,
.move-cell-clickable {
  appearance: none;
  background: transparent;
  border: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

button.move-cell:hover,
.move-cell-clickable:hover {
  background-color: var(--bg-tertiary);
  transform: translateX(2px);
}

button.move-cell:focus-visible,
.move-cell-clickable:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 1px;
  border-radius: 4px;
}

.move-san {
  font-weight: 600;
  color: var(--text-primary);
  font-size: 0.95em;
}

.move-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.7em;
  font-weight: 700;
  letter-spacing: 0.3px;
  white-space: nowrap;
  text-transform: uppercase;
  line-height: 1.4;
}

.empty-move {
  color: var(--text-secondary);
  font-size: 0.85em;
  font-style: italic;
  text-align: center;
  padding: 20px 0;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .move-row,
  .move-alternatives {
    animation: none;
  }

  .move-cell-clickable:hover {
    transform: none;
  }

  .alt-chip:hover {
    transform: none;
  }
}

/* Responsive: Mobile */
@media (max-width: 480px) {
  .move-history-panel {
    max-height: 300px;

  .opening-explorer {

    font-size: 0.8em;
  }

  .opening-name {

  }

  .opening-next-item {
    font-size: 0.8em;
  }
}

  backdrop-filter: blur(8px);
}

.game-review-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 32px;
  width: 90%;
  max-width: 480px;
  animation: lobby-slide-up 0.4s ease-out;
}

.game-review-title {
  font-size: 1.4em;
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
  margin: 0 0 4px 0;
}

.game-review-subtitle {
  font-size: 0.9em;
  color: var(--text-secondary);
  text-align: center;
  margin: 0 0 24px 0;
}

.accuracy-section {
  display: flex;
  gap: 24px;
  justify-content: center;
  margin-bottom: 24px;
}

.accuracy-card {
  flex: 1 1;
  text-align: center;
  padding: 20px 16px;
  border-radius: 12px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
}

.accuracy-card.high {
  border-color: #43A047;
}

.accuracy-card.medium {
  border-color: #FFA726;
}

.accuracy-card.low {
  border-color: #E53935;
}

.accuracy-side {
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.accuracy-score {
  font-size: 2.4em;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}

.accuracy-score.good { color: #43A047; }
.accuracy-score.ok { color: #FFA726; }
.accuracy-score.bad { color: #E53935; }

.accuracy-label {
  font-size: 0.75em;
  color: var(--text-secondary);
  font-weight: 500;
}

.breakdown-section {
  border-top: 1px solid var(--border-color);
  padding-top: 16px;
  margin-bottom: 24px;
}

.breakdown-title {
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}

.breakdown-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.breakdown-side h4 {
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 8px 0;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-color);
}

.breakdown-side ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.breakdown-count {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-size: 0.8em;
}

.breakdown-label {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-primary);
}

.breakdown-num {
  font-weight: 700;
  color: var(--text-secondary);
}

.breakdown-empty {
  color: var(--text-secondary);
  font-size: 0.8em;
  font-style: italic;
  text-align: center;
  padding: 8px 0;
}

.game-review-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.game-review-actions button {
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

@media (max-width: 480px) {
  .game-review-card {
    padding: 20px;
  }

  .accuracy-section {
    gap: 12px;
  }

  .accuracy-card {
    padding: 16px 12px;
  }

  .accuracy-score {
    font-size: 1.8em;
  }

  .breakdown-grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }
}

.accessible-dialog {
  border: none;
  padding: 0;
  background: transparent;
  max-width: 100%;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}

.accessible-dialog::backdrop {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: lobby-fade-in 0.3s ease-out;
}

/* ===== Online Lobby ===== */

@keyframes lobby-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes lobby-slide-up {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 20px rgba(93, 173, 226, 0.2); }
  50% { box-shadow: 0 0 40px rgba(93, 173, 226, 0.5); }
}

@keyframes dot-pulse {
  0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1.2); }
}

.online-lobby-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 32px;
  width: 90%;
  max-width: 440px;
  color: var(--text-primary);
  animation: lobby-slide-up 0.4s ease-out;
  position: relative;
  overflow: hidden;
}

.online-lobby-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent-primary), #a78bfa, var(--online-accent));
}

.lobby-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.lobby-header h2 {
  margin: 0;
  font-size: 1.5em;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}

.lobby-header h2 svg {
  color: var(--online-accent);
}

.lobby-close-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.3em;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.lobby-close-btn:hover {
  background: var(--bg-primary);
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

/* Lobby Tabs */
.lobby-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg-primary);
  border-radius: 10px;
  padding: 4px;
}

.lobby-tab {
  flex: 1 1;
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.lobby-tab:hover {
  color: var(--text-primary);
  background: var(--bg-secondary);
}

.lobby-tab.active {
  background: var(--bg-secondary);
  color: var(--accent-primary);
  box-shadow: 0 1px 4px var(--shadow-color);
}

/* Lobby Actions */
.lobby-actions {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.lobby-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--text-secondary);
  font-size: 0.85em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.lobby-divider::before,
.lobby-divider::after {
  content: '';
  flex: 1 1;
  height: 1px;
  background: var(--border-color);
}

.lobby-btn-create {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--online-accent), var(--accent-primary));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.05em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  letter-spacing: 0.3px;
}

.lobby-btn-create:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(93, 173, 226, 0.35);
}

.lobby-btn-create:active {
  transform: translateY(0);
}

.lobby-join-row {
  display: flex;
  gap: 10px;
}

.lobby-code-input {
  flex: 1 1;
  padding: 12px 16px;
  border: 2px solid var(--border-color);
  border-radius: 10px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 1.1em;
  font-weight: 600;
  letter-spacing: 4px;
  text-align: center;
  text-transform: uppercase;
  transition: border-color 0.2s ease;
  font-family: 'Inter', monospace;
}

.lobby-code-input::placeholder {
  color: var(--text-secondary);
  letter-spacing: 1px;
  font-weight: 400;
  font-size: 0.85em;
}

.lobby-code-input:focus {
  outline: none;
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(93, 173, 226, 0.15);
}

.lobby-btn-join {
  padding: 12px 24px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 2px solid var(--border-color);
  border-radius: 10px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.lobby-btn-join:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  background: var(--bg-secondary);
}

/* Waiting Screen */
.lobby-waiting {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 10px 0;
}

.lobby-code-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.lobby-code-display label {
  font-size: 0.85em;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.lobby-code-value {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-primary);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  padding: 14px 24px;
  animation: pulse-glow 2.5s ease-in-out infinite;
}

.lobby-code-value span {
  font-size: 2em;
  font-weight: 800;
  letter-spacing: 8px;
  color: var(--online-accent);
  font-family: 'Inter', monospace;
}

.lobby-code-copy-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lobby-code-copy-btn:hover {
  color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.lobby-waiting-dots {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  font-size: 0.95em;
}

.lobby-waiting-text {
  margin-left: 6px;
}

.lobby-player-color {
  font-size: 0.85em;
  color: var(--text-secondary);
}

.lobby-color-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 700;
  text-transform: capitalize;
}

.lobby-color-badge.color-white {
  color: #f0f0f0;
  background: #333;
}

.lobby-color-badge.color-black {
  color: #333;
  background: #f0f0f0;
}

.lobby-waiting-dots .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-primary);
  animation: dot-pulse 1.4s ease-in-out infinite;
}

.lobby-waiting-dots .dot:nth-child(2) {
  animation-delay: 0.2s;
}

.lobby-waiting-dots .dot:nth-child(3) {
  animation-delay: 0.4s;
}

.lobby-close-btn:focus-visible,
.lobby-tab:focus-visible,
.lobby-time-btn:focus-visible,
.lobby-btn-create:focus-visible,
.lobby-btn-join:focus-visible,
.lobby-btn-cancel:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.lobby-btn-cancel {
  padding: 10px 28px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.9em;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.lobby-btn-cancel:hover {
  border-color: var(--danger-color);
  color: var(--danger-color);
}

/* Error message */
.lobby-error {
  color: var(--danger-color);
  font-size: 0.85em;
  text-align: center;
  padding: 8px 12px;
  background: rgba(239, 68, 68, 0.1);
  border-radius: 8px;
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.lobby-error-spectate {
  margin-bottom: 12px;
}

/* ===== Online Status Bar (in-game) ===== */

.online-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  margin-bottom: 12px;
  gap: 12px;
  animation: fade-in-up 0.4s ease-out;
}

.online-status-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.9em;
  font-weight: 500;
}

.status-separator {
  margin: 0 4px;
  color: var(--border-color);
}

.connection-text {
  font-size: 0.85em;
  color: var(--text-secondary);
}

.spectator-count-text {
  font-size: 0.85em;
  color: var(--text-secondary);
}

.online-status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.online-status-dot.connected {
  background: var(--online-accent);
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
}

.online-status-dot.disconnected {
  background: var(--danger-color);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
}

.online-status-dot.your-turn {
  background: var(--online-accent);
  animation: dot-pulse 1s ease-in-out infinite;
}

.online-status-dot.reconnecting {
  background: #f59e0b;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
  animation: dot-pulse 0.6s ease-in-out infinite;
}

.online-status-actions {
  display: flex;
  gap: 8px;
}

.online-btn-resign {
  padding: 6px 14px;
  background: transparent;
  color: var(--danger-color);
  border: 1px solid var(--danger-color);
  border-radius: 6px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.online-btn-resign:hover {
  background: var(--danger-color);
  color: #fff;
}

.online-btn-takeback {
  padding: 6px 14px;
  background: transparent;
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
  border-radius: 6px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.online-btn-takeback:hover {
  background: var(--accent-primary);
  color: #fff;
}

.online-btn-takeback:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: transparent;
  color: var(--accent-primary);
}

.online-btn-draw {
  padding: 6px 14px;
  background: transparent;
  color: var(--online-accent);
  border: 1px solid var(--online-accent);
  border-radius: 6px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.online-btn-draw:hover {
  background: var(--online-accent);
  color: #fff;
}

.online-btn-draw:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: transparent;
  color: var(--online-accent);
}

.online-btn-leave {
  padding: 6px 14px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.online-btn-leave:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

/* ===== Game Action Dialog (Takeback / Draw) ===== */

.game-action-dialog::backdrop {
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  animation: lobby-fade-in 0.2s ease-out;
}

.game-action-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 32px;
  text-align: center;
  max-width: 360px;
  width: 90%;
  animation: lobby-slide-up 0.3s ease-out;
}

.game-action-icon {
  font-size: 2.5em;
  margin-bottom: 12px;
}

.game-action-card h2 {
  margin: 0 0 8px;
  font-size: 1.3em;
  color: var(--text-primary);
}

.game-action-card p {
  margin: 0 0 24px;
  color: var(--text-secondary);
  font-size: 1em;
}

.game-action-card .game-result-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.game-action-card .game-result-actions button {
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.game-action-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.game-action-btn {
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.game-action-btn.decline {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.game-action-btn.decline:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.game-action-btn.accept {
  background: var(--accent-primary);
  color: #fff;
  border: none;
}

.game-action-btn.accept:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(93, 173, 226, 0.35);
}

.game-action-btn:active {
  transform: scale(0.97);
}

.game-action-btn:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

/* ===== Game Result Dialog ===== */

.game-result-dialog::backdrop {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(6px);
  animation: lobby-fade-in 0.3s ease-out;
}

.game-result-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 36px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  animation: lobby-slide-up 0.4s ease-out;
}

.game-result-icon {
  font-size: 3em;
  margin-bottom: 12px;
}

.game-result-card h2 {
  margin: 0 0 8px;
  font-size: 1.6em;
  color: var(--text-primary);
}

.game-result-card p {
  margin: 0 0 24px;
  color: var(--text-secondary);
  font-size: 1em;
}

.game-result-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.game-result-actions button {
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.game-result-btn-share {
  background: transparent;
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
}

.game-result-btn-share:hover {
  background: var(--accent-primary);
  color: #fff;
  transform: translateY(-1px);
}

.game-result-btn-share:active {
  transform: translateY(0) scale(0.97);
}

.game-result-btn-share:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.game-result-btn-new {
  background: linear-gradient(135deg, var(--online-accent), var(--accent-primary));
  color: #fff;
  border: none;
}

.game-result-btn-new:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(93, 173, 226, 0.35);
}

.game-result-btn-close {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.game-result-btn-close:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

/* ===== Play Online button in Controls ===== */

.lobby-btn-online {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--online-accent), var(--accent-primary));
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
}

.lobby-btn-online:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(93, 173, 226, 0.3);
}

.lobby-btn-online:active {
  transform: translateY(0);
}

.lobby-btn-online:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  .accessible-dialog::backdrop,
  .game-result-dialog::backdrop,
  .game-action-dialog::backdrop {
    animation: none;
  }

  .online-lobby-card,
  .game-result-card,
  .game-action-card {
    animation: none;
  }

  .lobby-code-value {
    animation: none;
  }

  .lobby-waiting-dots .dot {
    animation: none;
    opacity: 0.6;
  }

  .chat-msg {
    animation: none;
  }

  .chat-reaction-emoji {
    animation: none;
  }

  .clock-display.clock-expired {
    animation: none;
    opacity: 0.7;
  }

  .online-status-dot.your-turn,
  .online-status-dot.reconnecting {
    animation: none;
  }

  .online-status-bar {
    animation: none;
  }

  .chat-panel {
    animation: none;
  }
}

/* ===== Chat Panel ===== */

.chat-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  margin-top: 12px;
  overflow: hidden;
  animation: fade-in-up 0.3s ease-out;
}

.chat-messages {
  max-height: 180px;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: thin;
}

.chat-empty {
  color: var(--text-secondary);
  font-size: 0.8em;
  text-align: center;
  padding: 20px 0;
  font-style: italic;
}

.chat-msg {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 0.85em;
  animation: fade-in-up 0.2s ease-out;
}

.chat-msg-own {
  flex-direction: row-reverse;
}

.chat-msg-own .chat-msg-text {
  background: var(--accent-primary);
  color: #fff;
  border-radius: 12px 4px 12px 12px;
}

.chat-msg-sender {
  font-size: 0.75em;
  font-weight: 600;
  flex-shrink: 0;
  min-width: 40px;
}

.chat-msg-sender.sender-white {
  color: var(--text-primary);
}

.chat-msg-sender.sender-black {
  color: var(--accent-primary);
}

.chat-msg-text {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 4px 12px 12px 12px;
  max-width: 80%;
  word-break: break-word;
  line-height: 1.3;
}

.chat-msg-time {
  display: block;
  font-size: 0.65em;
  opacity: 0.5;
  margin-top: 3px;
  text-align: right;
}

.chat-msg-own .chat-msg-time {
  color: rgba(255, 255, 255, 0.7);
}

.chat-reaction {
  justify-content: center;
  padding: 2px 0;
}

.chat-reaction-emoji {
  font-size: 1.8em;
  cursor: default;
  animation: lobby-slide-up 0.3s ease-out;
  transition: transform 0.2s ease;
}

.chat-reaction-emoji:hover {
  transform: scale(1.3);
}

.chat-reactions {
  display: flex;
  gap: 4px;
  padding: 8px 12px;
  border-top: 1px solid var(--border-color);
  flex-wrap: wrap;
  justify-content: center;
}

.reaction-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 1.2em;
  transition: all 0.2s ease;
  line-height: 1;
}

.reaction-btn:hover {
  background: var(--bg-secondary);
  border-color: var(--accent-primary);
  transform: scale(1.15);
}

.reaction-btn:active {
  transform: scale(0.95);
}

.chat-input-row {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--border-color);
}

.chat-input {
  flex: 1 1;
  padding: 8px 12px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 0.85em;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s ease;
}

.chat-input:focus {
  border-color: var(--accent-primary);
}

.chat-input::placeholder {
  color: var(--text-secondary);
}

.chat-send-btn {
  padding: 8px 16px;
  background: var(--accent-primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.chat-send-btn:hover {
  background: var(--accent-primary-hover);
}

.chat-send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== Clock Display in Status Bar ===== */

.clock-container {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.clock-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--bg-primary);
  border: 2px solid var(--border-color);
  min-width: 70px;
  transition: all 0.3s ease;
}

.clock-display.clock-active {
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
  box-shadow: 0 0 12px rgba(93, 173, 226, 0.25);
}

.clock-display.clock-expired {
  border-color: var(--danger-color);
  background: rgba(239, 68, 68, 0.1);
  animation: clock-expired-pulse 1s ease-in-out infinite;
}

@keyframes clock-expired-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.clock-label {
  font-size: 0.6em;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  font-weight: 600;
}

.clock-time {
  font-size: 1em;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  font-family: 'Inter', monospace;
  line-height: 1.3;
}

.clock-display.clock-expired .clock-time {
  color: var(--danger-color);
}

/* ===== Time Control Selector in Lobby ===== */

.lobby-time-control {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lobby-time-label {
  font-size: 0.75em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-secondary);
}

.lobby-time-options {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.lobby-time-btn {
  flex: 1 1;
  min-width: 48px;
  padding: 6px 8px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-primary);
  color: var(--text-secondary);
  font-size: 0.78em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  text-align: center;
}

.lobby-time-btn:hover {
  border-color: var(--accent-primary);
  color: var(--text-primary);
}

.lobby-time-btn.active {
  background: var(--accent-primary);
  color: #fff;
  border-color: var(--accent-primary);
}

.lobby-time-btn[aria-pressed="true"] {
  background: var(--accent-primary);
  color: #fff;
  border-color: var(--accent-primary);
}

/* ===== Online mode active indicator in controls ===== */
.online-mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: rgba(16, 185, 129, 0.1);
  color: var(--online-accent);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 20px;
  font-size: 0.75em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.online-mode-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--online-accent);
}

/* ===== Mobile online page refinements ===== */

@media (max-width: 640px) {
  .online-status-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 12px;
  }

  .online-status-info {
    justify-content: center;
    flex-wrap: wrap;
    font-size: 0.85em;
  }

  .online-status-actions {
    justify-content: space-between;
    gap: 8px;
  }

  .online-status-actions button {
    flex: 1 1 auto;
    min-height: 44px;
    min-width: 44px;
    font-size: 0.8em;
    padding: 8px 10px;
  }

  .clock-container {
    justify-content: center;
  }

  .clock-display {
    min-width: 60px;
    padding: 6px 10px;
  }

  .chat-panel {
    margin-top: 12px;
  }

  .chat-input-row {
    gap: 8px;
  }

  .chat-input,
  .chat-send-btn {
    min-height: 44px;
  }

  .chat-messages {
    max-height: 160px;
  }
}

/* ===== Responsive: Mobile (max-width 480px) ===== */
@media (max-width: 480px) {
  .game-action-buttons {
    flex-direction: column;
    gap: 8px;
  }

  .game-action-buttons .game-action-btn {
    width: 100%;
  }

  .online-lobby-card {
    padding: 20px;
    width: 95%;
  }

  .lobby-header h2 {
    font-size: 1.2em;
  }

  .lobby-code-value {
    padding: 10px 16px;
    gap: 8px;
  }

  .lobby-code-value span {
    font-size: 1.4em;
    letter-spacing: 4px;
  }

  .lobby-btn-create {
    padding: 12px 16px;
    font-size: 0.95em;
  }

  .lobby-join-row {
    flex-direction: column;
  }

  .lobby-btn-join {
    width: 100%;
  }

  .lobby-code-input {
    font-size: 1em;
    padding: 10px 12px;
  }

  .online-status-bar {
    flex-direction: column;
    gap: 8px;
    padding: 10px;
  }

  .online-status-info {
    font-size: 0.8em;
    flex-wrap: wrap;
    justify-content: center;
  }

  .online-status-actions {
    flex-wrap: wrap;
    justify-content: center;
  }

  .online-btn-takeback,
  .online-btn-draw,
  .online-btn-resign,
  .online-btn-leave {
    font-size: 0.7em;
    padding: 6px 10px;
  }

  .chat-panel {
    margin-top: 8px;
  }

  .chat-messages {
    max-height: 140px;
    padding: 8px;
  }

  .chat-msg {
    font-size: 0.8em;
  }

  .chat-msg-text {
    max-width: 90%;
  }

  .chat-reactions {
    padding: 6px 8px;
    gap: 3px;
  }

  .reaction-btn {
    padding: 4px 7px;
    font-size: 1em;
  }

  .game-result-card,
  .game-action-card {
    padding: 24px 16px;
  }

  .game-result-card h2 {
    font-size: 1.3em;
  }

  .game-action-card .game-result-actions {
    flex-direction: column;
    gap: 8px;
  }

  .game-action-card .game-result-actions button {
    width: 100%;

.puzzle-mode .App-body {
  grid-template-columns: 260px 1fr 200px;
}

/* ===== Left Panel: Puzzle Info ===== */

.puzzle-info-panel {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: pp-fade-in 0.5s ease-out forwards;
}

@keyframes pp-fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.puzzle-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.puzzle-title {
  margin: 0;
  font-size: 1.2em;
  font-weight: 700;
  color: var(--text-primary);
}

.puzzle-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.puzzle-rating {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.85em;
  font-weight: 600;
  color: var(--accent-primary);
}

.puzzle-id {
  font-size: 0.75em;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  padding: 2px 8px;
  border-radius: 4px;
  transition: background 0.2s ease;
}

.puzzle-id:hover {
  background: var(--bg-secondary);
}

.puzzle-themes {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.puzzle-theme-tag {
  font-size: 0.7em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--bg-tertiary);
  color: var(--accent-primary);
  border: 1px solid var(--border-color);
  transition: all 0.2s ease;
}

.puzzle-theme-tag:hover {
  background: var(--bg-secondary);
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

.puzzle-description {
  margin: 0;
  font-size: 0.85em;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* Stats row */
.puzzle-stats {
  display: flex;
  gap: 12px;
}

.puzzle-stat {
  flex: 1 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  transition: all 0.2s ease;
}

.puzzle-stat:hover {
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
}

.stat-value {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-label {
  font-size: 0.65em;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  font-weight: 600;
}

/* Progress bar */
.puzzle-progress {
  display: flex;
  align-items: center;
  gap: 8px;
}

.progress-bar {
  flex: 1 1;
  height: 6px;
  background: var(--bg-primary);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-primary), var(--online-accent));
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.progress-text {
  font-size: 0.75em;
  color: var(--text-secondary);
  font-weight: 600;
  flex-shrink: 0;
}

/* Solved banner — celebration animation */
.puzzle-solved-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(16, 185, 129, 0.06));
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 10px;
  animation: pp-solved-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes pp-solved-pop {
  0% { opacity: 0; transform: scale(0.85); }
  60% { opacity: 1; transform: scale(1.05); }
  100% { transform: scale(1); }
}

.solved-icon {
  font-size: 1.5em;
  animation: pp-solved-bounce 0.6s ease-out 0.3s;
}

@keyframes pp-solved-bounce {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-8px) scale(1.2); }
  60% { transform: translateY(-3px); }
}

.solved-text {
  font-size: 1em;
  font-weight: 700;
  color: var(--online-accent);
}

/* Puzzle action buttons */
.puzzle-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.puzzle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.puzzle-btn:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.puzzle-btn:active:not(:disabled) {
  transform: scale(0.95);
}

.puzzle-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.puzzle-btn:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.puzzle-btn-primary {
  background: linear-gradient(135deg, var(--online-accent), var(--accent-primary));
  color: #fff;
  border: none;
}

.puzzle-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(93, 173, 226, 0.3);
  color: #fff;
}

.puzzle-btn-primary:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
}

.puzzle-btn-start {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.puzzle-btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(93, 173, 226, 0.35);
}

.puzzle-btn-start:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
}

.puzzle-btn-start:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

/* Start screen (before any puzzle is loaded) */
.puzzle-start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding-top: 40px;
}

.puzzle-start-icon {
  font-size: 3em;
  animation: pp-float 3s ease-in-out infinite;
}

@keyframes pp-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.puzzle-start-screen h2 {
  margin: 0;
  font-size: 1.3em;
  color: var(--text-primary);
}

.puzzle-start-screen p {
  margin: 0;
  font-size: 0.85em;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ===== Center: Board ===== */

.puzzle-board-wrapper {
  position: relative;
}

/* ===== Right Panel: Solution ===== */

.puzzle-moves-panel {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: pp-fade-in 0.5s ease-out 0.15s both;
}

.panel-title {
  margin: 0;
  font-size: 0.9em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
}

.puzzle-solution-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 400px;
  overflow-y: auto;
}

.solution-move {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.85em;
  transition: all 0.2s ease;
}

.solution-move:hover {
  background: var(--bg-primary);
}

.solution-move.played {
  background: rgba(16, 185, 129, 0.08);
  color: var(--online-accent);
}

.solution-move.next {
  background: rgba(93, 173, 226, 0.1);
  border: 1px solid var(--accent-primary);
  animation: pulse-glow 2s ease-in-out infinite;
}

.move-number {
  font-size: 0.75em;
  color: var(--text-secondary);
  min-width: 24px;
  text-align: right;
  font-weight: 600;
}

.move-san {
  font-weight: 600;
  font-family: 'Inter', monospace;
}

.move-san.player {
  color: var(--text-primary);
}

.move-san.opponent {
  color: var(--text-secondary);
}

/* Puzzle navigation */
.puzzle-nav {
  display: flex;
  gap: 8px;
  margin-top: auto;
}

.puzzle-nav-btn {
  flex: 1 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.puzzle-nav-btn:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

.puzzle-nav-btn:active:not(:disabled) {
  transform: scale(0.95);
}

.puzzle-nav-btn:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

/* Start info state */
.puzzle-start-info {
  text-align: center;
  padding-top: 40px;
}

.puzzle-start-info p {
  margin: 0 0 12px;
  font-size: 0.85em;
  color: var(--text-secondary);
  line-height: 1.5;
}

.puzzle-start-sub {
  font-size: 0.8em;
}

/* ===== Hint Animation ===== */
@keyframes pulse-hint {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ===== Difficulty Filter ===== */

.difficulty-selector {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.difficulty-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
}

.difficulty-buttons {
  display: flex;
  gap: 6px;
}

.diff-btn {
  flex: 1 1;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.8em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  text-align: center;
}

.diff-btn:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

.diff-btn:active:not(:disabled) {
  transform: scale(0.95);
}

.diff-btn.active {
  background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(93, 173, 226, 0.3);
}

.diff-btn:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.difficulty-filter-bar {
  display: flex;
  gap: 6px;
  padding: 4px 0;
}

.difficulty-filter-bar .diff-btn {
  padding: 5px 10px;
  font-size: 0.75em;
}

/* ===== Responsive: Mobile ===== */
@media (max-width: 768px) {
  .puzzle-mode .App-body {
    grid-template-columns: 1fr;
    grid-template-areas:
      "chessboard"
      "info"
      "solution";
  }

  .puzzle-info-panel {
    padding: 16px;
  }

  .puzzle-moves-panel {
    padding: 16px;
  }

  .puzzle-stats {
    gap: 8px;
  }

  .puzzle-stat {
    padding: 8px;
  }

  .stat-value {
    font-size: 1.1em;
  }

  .puzzle-actions {
    justify-content: center;
  }

  .puzzle-solution-list {
    max-height: 200px;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .puzzle-info-panel,
  .puzzle-moves-panel {
    animation: none;
  }

  .puzzle-solved-banner {
    animation: none;
  }

  .solved-icon {
    animation: none;
  }

  .puzzle-start-icon {
    animation: none;
  }

  .progress-fill {
    transition: none;
  }

  .solution-move.next {
    animation: none;
  }
}

.puzzle-rush-mode .App-body {
  grid-template-columns: 260px 1fr 200px;
}

/* ===== Timer Bar ===== */

.rush-timer-bar {
  position: relative;
  width: 100%;
  height: 28px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.rush-timer-fill {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--online-accent), var(--accent-primary));
  border-radius: 14px;
  transition: width 0.1s linear, background 0.3s ease;
}

.rush-timer-text {
  position: relative;
  z-index: 1;
  font-size: 0.8em;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  letter-spacing: 0.03em;
  font-variant-numeric: tabular-nums;
}

.rush-timer-urgent .rush-timer-fill {
  background: linear-gradient(90deg, var(--danger-color), #f97316);
  animation: rush-pulse-urgent 0.6s ease-in-out infinite;
}

@keyframes rush-pulse-urgent {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

/* ===== Hearts (Lives) ===== */

.rush-hearts {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 12px;
}

.rush-heart-full {
  color: var(--danger-color);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  animation: rush-heart-pop 0.4s ease-out forwards;
}

.rush-heart-empty {
  color: var(--border-color);
  transition: transform 0.3s ease;
}

@keyframes rush-heart-pop {
  0% { transform: scale(0.3); opacity: 0; }
  60% { transform: scale(1.4); }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== Score Section ===== */

.rush-score-section {
  text-align: center;
  margin-bottom: 12px;
}

.rush-main-score {
  font-size: 2.2em;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.rush-combo {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 28px;
  flex-wrap: wrap;
}

.rush-combo-badge {
  font-size: 0.8em;
  font-weight: 700;
  color: var(--accent-primary);
  background: rgba(93, 173, 226, 0.12);
  padding: 2px 10px;
  border-radius: 12px;
}

.rush-streak-badge {
  font-size: 0.75em;
  font-weight: 600;
  color: var(--danger-color);
  animation: rush-streak-pulse 2s ease-in-out infinite;
}

@keyframes rush-streak-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.rush-score-popup {
  font-size: 0.85em;
  font-weight: 700;
  color: var(--online-accent);
  animation: rush-score-pop 1s ease-out forwards;
  position: absolute;
}

@keyframes rush-score-pop {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.3); }
}

/* ===== Puzzle Meta (in HUD) ===== */

.rush-puzzle-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rush-puzzle-themes {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.rush-puzzle-desc {
  margin: 0;
  font-size: 0.8em;
  color: var(--text-secondary);
  line-height: 1.4;
}

.rush-puzzle-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.rush-progress {
  font-size: 0.7em;
  font-weight: 600;
  color: var(--accent-primary);
}

/* ===== HUD Panel ===== */

.rush-hud-panel {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rush-hud {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ===== Board Shake ===== */

.rush-shake {
  animation: rush-shake-anim 0.5s ease-out;
}

@keyframes rush-shake-anim {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-8px); }
  30% { transform: translateX(8px); }
  50% { transform: translateX(-5px); }
  70% { transform: translateX(5px); }
  90% { transform: translateX(-2px); }
}

/* ===== Solution Panel ===== */

.rush-solution-panel {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.panel-title {
  margin: 0;
  font-size: 0.85em;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
}

.rush-solution-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 300px;
  overflow-y: auto;
}

.solution-move {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: 6px;
  font-size: 0.8em;
  transition: all 0.2s ease;
}

.solution-move.played {
  background: rgba(16, 185, 129, 0.08);
  color: var(--online-accent);
}

.solution-move.next {
  background: rgba(93, 173, 226, 0.1);
  border: 1px solid var(--accent-primary);
}

.move-number {
  font-size: 0.7em;
  color: var(--text-secondary);
  min-width: 20px;
  text-align: right;
  font-weight: 600;
}

.move-san {
  font-weight: 600;
  font-family: 'Inter', monospace;
}

.move-san.player { color: var(--text-primary); }
.move-san.opponent { color: var(--text-secondary); }

.rush-puzzle-info {
  margin-top: auto;
  font-size: 0.75em;
  color: var(--text-secondary);
  text-align: center;
}

.puzzle-rating {
  font-weight: 600;
  color: var(--accent-primary);
}

/* ===== Side panel idle states ===== */

.rush-side-start {
  text-align: center;
  padding-top: 60px;
  color: var(--text-secondary);
}

.rush-side-start svg {
  margin-bottom: 12px;
  opacity: 0.4;
}

.rush-side-start p {
  font-size: 0.85em;
  line-height: 1.5;
}

/* ===== Start Screen ===== */

.rush-start {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  padding-top: 8px;
}

.rush-start-icon {
  font-size: 2.5em;
  animation: pp-float 3s ease-in-out infinite;
}

.rush-start h2 {
  margin: 0;
  font-size: 1.3em;
  font-weight: 700;
  color: var(--text-primary);
}

.rush-start p {
  margin: 0;
  font-size: 0.82em;
  color: var(--text-secondary);
  line-height: 1.5;
}

.rush-start-time {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.rush-start-time-label {
  font-size: 0.7em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
}

.rush-time-buttons {
  display: flex;
  gap: 6px;
}

.rush-time-btn {
  flex: 1 1;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.82em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.rush-time-btn:hover {
  border-color: var(--accent-primary);
  color: var(--text-primary);
}

.rush-time-btn.active {
  background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(93, 173, 226, 0.3);
}

.rush-rules {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-primary);
  border-radius: 10px;
  border: 1px solid var(--border-color);
}

.rush-rule {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.73em;
  color: var(--text-secondary);
}

.rush-rule svg {
  flex-shrink: 0;
  color: var(--accent-primary);
}

.rush-highscore {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85em;
  font-weight: 600;
  color: #f59e0b;
}

.rush-btn-start {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}

.rush-btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(93, 173, 226, 0.35);
}

.rush-btn-start:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
}

/* ===== Countdown ===== */

.rush-countdown {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
}

.rush-countdown-num {
  font-size: 4em;
  font-weight: 800;
  color: var(--accent-primary);
  animation: rush-count-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
}

@keyframes rush-count-pop {
  0% { transform: scale(0.5); opacity: 0.4; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 0.8; }
}

/* ===== End Screen ===== */

.rush-end {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  padding-top: 12px;
}

.rush-end-icon {
  font-size: 3em;
}

.rush-end h2 {
  margin: 0;
  font-size: 1.2em;
  font-weight: 700;
  color: var(--text-primary);
}

.rush-end-sub {
  margin: 0;
  font-size: 0.85em;
  color: var(--text-secondary);
}

.rush-end-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.rush-end-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 10px 16px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 8px;
}

.rush-end-stat-value {
  font-size: 1.4em;
  font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.rush-end-stat-label {
  font-size: 0.65em;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  font-weight: 600;
}

.rush-end-high {
  background: rgba(245, 158, 11, 0.08);
  border-color: #f59e0b;
  color: #f59e0b;
}

.rush-end-best {
  margin: 0;
  font-size: 0.8em;
  color: var(--text-secondary);
}

.rush-end-actions {
  width: 100%;
  margin-top: 4px;
}

/* ===== Responsive ===== */

@media (max-width: 768px) {
  .puzzle-rush-mode .App-body {
    grid-template-columns: 1fr;
    grid-template-areas:
      "chessboard"
      "hud"
      "solution";
  }

  .rush-hud-panel {
    padding: 12px;
  }

  .rush-solution-panel {
    padding: 12px;
  }

  .rush-solution-list {
    max-height: 150px;
  }

  .rush-main-score {
    font-size: 1.8em;
  }

  .rush-timer-bar {
    height: 24px;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .rush-heart-full,
  .rush-score-popup,
  .rush-countdown-num {
    animation: none;
  }

  .rush-shake {
    animation: none;
  }
}

.gh-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.gh-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.gh-title {
  margin: 0;
  font-size: 1.1em;
  font-weight: 700;
  color: var(--text-primary);
}

.gh-count {
  font-size: 0.75em;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}

/* ── Loading skeleton ── */
.gh-loading {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.gh-skeleton {
  height: 64px;
  background: var(--bg-tertiary);
  border-radius: 10px;
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}

@keyframes skeleton-pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* ── Empty state ── */
.gh-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px 20px;
  text-align: center;
}

.gh-empty-icon {
  font-size: 3em;
}

.gh-empty h3 {
  margin: 0;
  font-size: 1.1em;
  color: var(--text-primary);
}

.gh-empty p {
  margin: 0;
  font-size: 0.85em;
  color: var(--text-secondary);
  line-height: 1.5;
  max-width: 280px;
}

/* ── Game list ── */
.gh-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 480px;
  overflow-y: auto;
}

.gh-item {
  display: flex;
  gap: 4px;
  align-items: stretch;
  animation: gh-item-fade 0.4s ease-out both;
  animation-delay: calc(var(--stagger, 0) * 0.05s);
}

@keyframes gh-item-fade {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.gh-item-main {
  flex: 1 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  font-family: inherit;
  color: var(--text-primary);
}

.gh-item-main:hover {
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
}

.gh-item-main:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.gh-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.gh-source {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7em;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent-primary);
}

.gh-date {
  font-size: 0.7em;
  color: var(--text-secondary);
  font-weight: 500;
}

.gh-item-bottom {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gh-result {
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-primary);
}

.gh-reason {
  font-size: 0.85em;
  color: var(--text-secondary);
  font-weight: 400;
}

.gh-moves {
  font-size: 0.7em;
  color: var(--text-secondary);
  font-weight: 500;
  margin-left: auto;
}

.gh-replay-icon {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7em;
  font-weight: 600;
  color: var(--accent-primary);
  opacity: 0;
  transition: opacity 0.2s ease;
  flex-shrink: 0;
}

.gh-item-main:hover .gh-replay-icon {
  opacity: 1;
}

/* ── Delete button ── */
.gh-delete-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  padding: 0;
}

.gh-delete-btn:hover {
  color: #ef4444;
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
}

.gh-delete-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.gh-delete-btn:focus-visible {
  outline: 2px solid #ef4444;
  outline-offset: 2px;
}

.history-page-layout .App-body {
  display: flex;
  justify-content: center;
}

.history-page {
  width: 100%;
  max-width: 600px;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  animation: hp-fade-in 0.5s ease-out forwards;
}

@keyframes hp-fade-in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.history-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  animation: hp-fade-in 0.5s ease-out 0.1s both;
}

.history-back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
  margin-top: 4px;
}

.history-back-btn:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  transform: translateX(-2px);
}

.history-back-btn:active:not(:disabled) {
  transform: translateX(-2px) scale(0.95);
}

.history-back-btn:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

.history-header-text {
  flex: 1 1;
}

.history-title {
  margin: 0;
  font-size: 1.4em;
  font-weight: 700;
  color: var(--text-primary);
}

.history-subtitle {
  margin: 4px 0 0;
  font-size: 0.85em;
  color: var(--text-secondary);
}

.history-header-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
  border-radius: 14px;
  color: #fff;
  flex-shrink: 0;
  animation: hp-fade-in 0.5s ease-out 0.15s both;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.history-header-icon:hover {
  transform: scale(1.05) rotate(-3deg);
  box-shadow: 0 4px 16px rgba(93, 173, 226, 0.3);
}

/* ── Replay Modal ── */
.replay-modal-content {
  display: flex;
  flex-direction: column;
  padding: 8px 0;
  animation: hp-fade-in 0.3s ease-out;
}

.replay-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.replay-actions button {
  transition: all 0.2s ease;
}

.replay-actions button:active:not(:disabled) {
  transform: scale(0.97);
}

.replay-actions button:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .history-page {
    padding: 20px 16px;
  }

  .history-header-icon {
    display: none;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  .history-page,
  .history-header,
  .history-header-icon,
  .replay-modal-content {
    animation: none;
  }

  .history-back-btn:hover {
    transform: none;
  }

  .history-header-icon:hover {
    transform: none;
