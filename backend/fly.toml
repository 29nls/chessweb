# fly.toml - Fly.io configuration for chessweb backend
# Generated by: fly launch --no-deploy
# Edit and customize as needed

app = "chessweb-backend"
primary_region = "ams"  # Change to your nearest region (ams, fra, iad, sjc, etc.)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # WebSocket support - crucial for Socket.IO
  protocol = "tcp"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  # Default CORS origin - override with fly secrets set CORS_ORIGIN
  CORS_ORIGIN = "https://chessweb-nu.vercel.app"
