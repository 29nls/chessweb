app = 'backend-damp-ember-8445'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGIN = 'https://chessweb-nu.vercel.app'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
