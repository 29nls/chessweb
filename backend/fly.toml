# fly.toml app configuration file generated for backend-damp-ember-8445 on 2026-06-25T03:31:30+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-damp-ember-8445'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  # WebSocket support - crucial for Socket.IO
  protocol = "tcp"

[env]
  NODE_ENV = "production"
  CORS_ORIGIN = "https://chessweb-nu.vercel.app"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
